server {
  listen 0.0.0.0:80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / { try_files $uri $uri/ /index.html; }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Readiness requires the built application to exist and be served by Nginx.
  location = /health {
    access_log off;
    try_files /index.html =503;
  }
}
